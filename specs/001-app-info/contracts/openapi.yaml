openapi: 3.0.0
info:
  title: OpenBunker Application Information API
  version: 1.0.0
  description: API contracts for application information handling feature

paths:
  /api/openbunker-unauthenticated-token:
    post:
      summary: Request connection token with application information
      description: Creates a connection token and sends verification email with application profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - scope
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                scope:
                  type: string
                  description: Scope slug for the connection
                appUrl:
                  type: string
                  format: uri
                  description: Application canonical URL (optional, for displaying app info in email)
                  example: "https://app.example.com"
      responses:
        '200':
          description: Connection token created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Verification code sent to your email"
                  bunkerConnectionToken:
                    type: string
                    description: Bunker connection token (if scope allows)
        '400':
          description: Bad request (missing email, invalid scope, or application not allowed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Application not allowed in this scope"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to send verification email"

  /api/scopes/{slug}:
    get:
      summary: Get scope details including allowed applications
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Scope slug
      responses:
        '200':
          description: Scope details
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      allowedApplications:
                        type: array
                        items:
                          type: string
                        nullable: true
                        description: Array of allowed application pubkeys or URLs. Null or empty means all applications allowed.
                        example: ["npub1abc...", "https://app.example.com"]
        '404':
          description: Scope not found
        '401':
          description: Unauthorized

    patch:
      summary: Update scope including allowed applications
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                allowedApplications:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: Array of allowed application identifiers. Set to null or [] to allow all applications.
                  example: ["npub1abc...", "https://app.example.com"]
      responses:
        '200':
          description: Scope updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: object
        '400':
          description: Bad request (invalid application identifiers)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid application identifier format"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not scope owner)
        '404':
          description: Scope not found

components:
  schemas:
    ApplicationProfile:
      type: object
      description: Application profile information from Nostr kind: 0 event
      properties:
        pubkey:
          type: string
          description: Application pubkey in hex format
        canonicalUrl:
          type: string
          format: uri
          nullable: true
          description: Original canonical URL used for resolution
        name:
          type: string
          nullable: true
          description: Application name
        icon:
          type: string
          format: uri
          nullable: true
          description: Application icon/avatar URL
        description:
          type: string
          nullable: true
          description: Application description/about
